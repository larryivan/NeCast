name: tests

on: [push, pull_request]

jobs:
  necast:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bgzip and tabix
        run: if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y tabix; else brew install htslib; fi
      - name: Install NeCast
        run: |
          if [ "$RUNNER_OS" = Linux ]; then pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          pip install -e ".[simulate,dev]"
      - run: python -m pytest tests --ignore=tests/simulator
      - run: necast example

  simulator:
    # some of its tests compare floats exactly with values recorded on Apple silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[simulate,dev]"
      - run: python -m pytest tests/simulator
