name: tests

on: [push, pull_request]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bgzip and tabix
        run: if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y tabix; else brew install htslib; fi
      - name: Install NeCast
        run: |
          if [ "$RUNNER_OS" = Linux ]; then pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          pip install -e ".[simulate,dev]"
      - run: python -m pytest tests
      - run: necast example
