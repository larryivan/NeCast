[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "necast"
version = "0.1.0"
description = "Population size history from unphased genotypes and genetic maps"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND GPL-3.0-or-later"     # the stdpopsim histories are under stdpopsim's GPL
license-files = ["LICENSE", "necast/third_party/**/LICENSE*.txt"]
authors = [{ name = "Yufan Han" }]
keywords = ["population genetics", "effective population size", "demographic inference", "coalescent"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "cyvcf2>=0.31.1",
    "matplotlib>=3.9",
    "numba>=0.60",
    "numpy>=2",
    "torch>=2.4",
]

[project.optional-dependencies]
# necast simulate. msprime 1.4.2 made the published simulations; pandas writes
# the metadata tables beside every dataset.
simulate = ["msprime==1.4.2", "pandas>=2.2.2", "tqdm>=4.60"]
# Only to rebuild the deCODE map and the stdpopsim histories, never to use them.
build-assets = ["stdpopsim==0.3.0", "pyBigWig>=0.3"]
dev = ["pytest>=8.0"]

[project.scripts]
necast = "necast.cli:main"

[tool.setuptools.packages.find]
include = ["necast*"]

[tool.setuptools.package-data]
"necast.weights" = ["*.pt"]
"necast.example" = ["*"]
"necast.third_party" = ["README.md"]
"necast.third_party.psmcplus" = ["LICENSE.txt"]
"necast.third_party.maps" = ["*.bed"]
"necast.third_party.reference" = ["*.bed"]
"necast.third_party.histories.human_ne" = [
    "README.md",
    "LICENSE-pyrho.txt",
    "smcpp_popsizes_1kg.csv",
    "phlash_unified_populations_normalized.csv",
    "phlash_superpopulations_normalized.csv",
    "msmc2_yoruba_french_within_ne_normalized.csv",
    "msmc_im_yoruba_french_ne_normalized.csv",
]
"necast.third_party.histories.stdpopsim_single_pop" = ["trajectories.csv", "LICENSE-stdpopsim.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
