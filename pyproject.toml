[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlcoalsim"
version = "0.1.0"
description = "Coalescent simulation datasets for demographic-history inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "msprime>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
stdpopsim = [
    "stdpopsim>=0.2",
]
parquet = [
    "pyarrow>=12",
]
tutorial = [
    "ipython>=8.12",
    "jupyterlab>=4",
    "matplotlib>=3.7",
]
map-processing = [
    "polars>=0.20",
    "pooch>=1.7",
    "pyarrow>=12",
]
test = [
    "pytest>=8",
]

[project.scripts]
dlcoalsim = "simulator.cli:main"
dlcoalsim-dataset-admin = "scripts.dataset_admin:main"

[project.urls]
Repository = "https://github.com/larryivan/DLCoal"

[tool.setuptools.packages.find]
where = ["."]
include = ["simulator*", "scripts*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
