[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "necast"
version = "0.1.0"
description = "Population size history from unphased genotypes and genetic maps"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yufan Han" }]
keywords = ["population genetics", "effective population size", "demographic inference", "coalescent"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# msprime carries tskit and numpy.  pandas is used for the metadata tables the
# generator writes beside every dataset.
dependencies = [
    "cyvcf2>=0.30",
    "matplotlib>=3.7",
    "msprime>=1.3",
    "numba>=0.59",
    "numpy>=1.26",
    "pandas>=2.0",
    "torch>=2.1",
]

[project.optional-dependencies]
# Needed only to rebuild the frozen assets, never to use them.  The eighteen
# held-out catalogue trajectories and the recombination map ship in the
# package; these pull in the tools that produced them.
build-assets = ["stdpopsim>=0.3", "pyBigWig>=0.3"]
dev = ["pytest>=8.0"]

[project.scripts]
necast = "necast.cli:main"
dlcoalsim = "necast.simulator.cli:main"

[tool.setuptools.packages.find]
include = ["necast*"]

[tool.setuptools.package-data]
"necast.weights" = ["*.pt"]
"necast.example" = ["*"]
"necast.third_party" = ["README.md"]
"necast.third_party.psmcplus" = ["LICENSE.txt"]
"necast.third_party.maps" = ["*.bed"]
"necast.third_party.histories.human_ne" = [
    "README.md",
    "smcpp_popsizes_1kg.csv",
    "phlash_unified_populations_normalized.csv",
    "phlash_superpopulations_normalized.csv",
    "msmc2_yoruba_french_within_ne_normalized.csv",
    "msmc_im_yoruba_french_ne_normalized.csv",
]
"necast.third_party.histories.stdpopsim_single_pop" = ["trajectories.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
